# spaces-iot-bridge configuration. This SAMPLE is committed; the real file is
# /config.toml, which .gitignore keeps out because it names credential files.
# Every decision here is explained in issue #1.

[server]
# css-server itself, for the one HTTPS call a device makes: registration.
url = "https://spaces.example.org"

[edge]
broker = "mqtt://127.0.0.1:1883"
# One account on the edge's broker for the whole bridge: write
# resource/request/#, read resource/lease. The edge reads device_id from the
# payload and never from the login, so per-device logins would buy nothing.
credentials = "/var/lib/spaces-iot-bridge/edge.toml"     # 0600

[iot]
# Needed only when a [[device]] has `backend = "zigbee2mqtt"`.
broker = "mqtt://jarvis:1883"
# A dedicated user, scoped by topic to the bridged devices only -- here that
# works, because Zigbee2MQTT's topics are per device.
credentials = "/var/lib/spaces-iot-bridge/iot.toml"      # 0600
base = "zigbee2mqtt"

[[device]]
name      = "extractor"
backend   = "zigbee2mqtt"
friendly  = "hackspace/south_wall/plug/filters"
# The plug's 64-bit IEEE address. NOT what registers as mac_address -- that
# column is 17 characters and this is 23; the bridge registers with the host's
# own MAC and keeps this here and in the device name.
ieee      = "00:12:4b:00:1c:a1:b2:c3"
role      = "power"
resource  = "laser"
# Written by registration, 0600. Nothing re-registers on its own.
identity  = "/var/lib/spaces-iot-bridge/identities/extractor.toml"
# From `bridge probe extractor`, written BY HAND after both halves pass: the
# plug honours on_time, AND re-sending it while ON extends the deadline.
countdown = true
# The plug's countdown is the backstop, sized for the device, not the lease.
# The edge regrants every second; re-arming on every grant is one Zigbee write
# per second per plug. The bridge's own watchdog honours the 3 s lease TTL.
on_time_s = 60
rearm_s   = 15
# A leased extractor going Unknown or Off -> after a 10 s debounce -> a `stop`
# on the resource. Stage confirmation is sticky, so nothing else catches
# extraction failing mid-job.
stop_resource_on_loss = true

# ---------------------------------------------------------------------------
# Home Assistant (#20): on-prem, over its WebSocket API. Needed only when a
# [[device]] has `backend = "homeassistant"`. A dedicated non-admin user that
# can only log in from the local network, and a long-lived access token from
# it, alone in a 0600 file. HA has no per-entity permissions: this token can
# drive every lock in that HA, not only the one below.
[homeassistant]
url        = "ws://ha.local:8123/api/websocket"
token_file = "/var/lib/spaces-iot-bridge/ha-token"            # 0600

# A door whose lock only Home Assistant can reach. It is a POWER module on the
# door resource -- the edge leases a door's power bindings for exactly the
# strike pulse -- and the bridge registers it as `power` AND `strike`, so the
# door has a pulse at all (a door with no strike binding has a pulse of zero
# and would never lease it). Bind it as both in Resource Wiring; give the
# strike binding the pulse you want and hold_open_access = false.
# Lease granted -> lock.unlock; withdrawn -> lock.lock. Unlocked is "on".
[[device]]
name      = "workshop-door"
backend   = "homeassistant"
entity    = "lock.workshop_door"
role      = "power"
resource  = "workshop-door"
identity  = "/var/lib/spaces-iot-bridge/identities/workshop-door.toml"
# Nothing can measure a Home Assistant entity's countdown, so none is claimed:
# the lock relocks on the lease and holds its last state if the link drops.
# (countdown, on_time_s and rearm_s are not used for this backend.)
# A leased lock that HA cannot see for 10 s -> a `stop` on the door, which
# ends the session and withdraws the lease: fail secure.
stop_resource_on_loss = true

# A door contact Home Assistant already has, as a SENSOR module (#25): its
# reading feeds the `door_open` interlock on the resource it is bound to
# (CS:S #213). It switches nothing and ignores its lease. Unknown is silent:
# when HA cannot see the contact the bridge stops reporting AND stops pulsing
# alive, so the edge's own silence detection denies the tool.
[[device]]
name      = "mill-door"
backend   = "homeassistant"
entity    = "binary_sensor.mill_door_contact"
role      = "sensor"
# Which condition this is the reading for. The edge accepts it only if an
# enabled interlock rule on the resource names it.
condition = "door_open"
# HA's `on` for a door contact means OPEN, which is door_open asserted. A
# contact wired the other way, or a requirement whose `on` is the bad state,
# sets invert = true.
invert    = false
resource  = "mill"
identity  = "/var/lib/spaces-iot-bridge/identities/mill-door.toml"
