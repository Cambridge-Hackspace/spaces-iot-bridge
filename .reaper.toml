# Reaper tenant for the bridge: build and test the crate in a digest-pinned
# Rust container on the generic Ubuntu guest. The one git dependency,
# spaces-device, is public, so the guest fetches it with no credential.
#
# What this does NOT cover: anything with a broker. The pure core needs none;
# the adapters' integration tier (a real mosquitto, the real edge in the CS:S
# e2e stack) is its own issue and will want `exec = "host"`.

schema = 1
project = "spaces-iot-bridge"

guests = ["ubuntu-26.04"]
exec = "container"

[build]
# docker.io/library/rust:1.97, resolved 2026-08-13 and known to run on this
# guest: it is the same image reaper's own tenant builds in.
image = "docker.io/library/rust@sha256:3382bd20aa942806c533e9a73cd000474fb3ef173f71e684cc9b942675781769"
# cmake is aws-lc-sys's one build requirement beyond a C compiler, and the
# stock Rust image does not promise it. Installing it is the tenant's business,
# as reaper's own manifest says of its apt line.
cmd = "apt-get -qq update && apt-get -qq install -y cmake > /dev/null && CARGO_HOME=$REAPER_CACHE_CARGO CARGO_TARGET_DIR=$REAPER_CACHE_TARGET cargo build --locked --tests"
cache = ["cargo", "target"]

[run]
# The broker tier runs here too, against a real mosquitto started inside the
# container from Debian's package -- the same arrangement reaper's own tenant
# uses for its apt-only dependencies: the environment is the tenant's business.
# `--include-ignored` is the opt-in for that tier; the unit suite is hermetic and
# the broker tests are not, so they are #[ignore]d everywhere a broker is not
# promised. No pipe into tee: /bin/sh may be dash. Redirect, capture the real
# status, echo the log for the live view, re-raise.
cmd = """
apt-get -qq update && apt-get -qq install -y mosquitto > /dev/null && \
printf 'listener 1883 127.0.0.1\nallow_anonymous true\npersistence false\n' > /tmp/mosq.conf && \
(mosquitto -c /tmp/mosq.conf > /tmp/mosq.log 2>&1 &) && sleep 1 && \
BRIDGE_TEST_BROKER=127.0.0.1:1883 \
CARGO_HOME=$REAPER_CACHE_CARGO CARGO_TARGET_DIR=$REAPER_CACHE_TARGET \
cargo test --locked -- --include-ignored > "$REAPER_OUT"/cargo-test.log 2>&1; s=$?; cat "$REAPER_OUT"/cargo-test.log; exit $s"""

[sync]
# Built on the development host for a different OS; rebuilt in the cache.
exclude = ["/target/", "/out/"]

[resources]
cores = 2
ram_gb = 4
