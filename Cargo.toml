[package]
name = "spaces-iot-bridge"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Cambridge-Hackspace/spaces-iot-bridge"
description = "Makes devices on an IoT broker appear to a Spaces edge as modules"
publish = false

[dependencies]
# The module protocol with no hardware and no I/O: wire types, registration,
# the lease watchdog. Pinned to a tag, never a branch, so a build is a build of
# something nameable. Public, so a reaper guest fetches it with no credential.
spaces-device = { git = "https://github.com/Cambridge-Hackspace/spaces-firmware", tag = "v0.6.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# default-features = false: the default is `use-rustls`, which would pull a TLS
# provider -- and the aws-lc-sys/cmake question with it -- into a service whose
# brokers are LAN mqtt:// by design (#1). No TLS feature means no provider and
# no PQ question, because there is no TLS. If a TLS broker ever appears, the
# answer is aws-lc-rs and cmake in the tenant, per the post-quantum principle.
rumqttc = { version = "0.25", default-features = false }
# HTTPS, for the one call that needs it: POST /api/devices/register. The
# post-quantum recipe CS:S's own CLI uses: reqwest with the NO-PROVIDER rustls
# feature, and the provider named here, explicitly, so it is this crate's
# decision -- `aws_lc_rs` because ML-KEM lives only there, `prefer-post-quantum`
# named because reqwest pulls rustls with default features off.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots-no-provider"] }
rustls = { version = "0.23", features = ["aws_lc_rs", "prefer-post-quantum"] }
# The bridge host's own MAC, which is what registers: the platform's column is
# 17 characters and a Zigbee IEEE address is 23 (#1 q2).
mac_address = "1.1"
# Home Assistant's WebSocket API (#20). No default features: `connect` and
# `handshake` are the client, and the test fake's server side; the rustls
# feature is for `wss://` behind a reverse proxy, with the public roots. It
# pulls rustls with default features OFF, like reqwest does, so the provider is
# the one `tls.rs` installs -- aws-lc-rs, post-quantum preferred -- and not a
# second one chosen by a dependency.
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1.36", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal"] }
