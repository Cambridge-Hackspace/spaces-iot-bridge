[package]
name = "spaces-iot-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Cambridge-Hackspace/spaces-iot-bridge"
description = "Makes devices on an IoT broker appear to a Spaces edge as modules"
publish = false

[dependencies]
# The module protocol with no hardware and no I/O: wire types, registration,
# the lease watchdog. Pinned to a tag, never a branch, so a build is a build of
# something nameable. Public, so a reaper guest fetches it with no credential.
spaces-device = { git = "https://github.com/Cambridge-Hackspace/spaces-firmware", tag = "v0.4.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# default-features = false: the default is `use-rustls`, which would pull a TLS
# provider -- and the aws-lc-sys/cmake question with it -- into a service whose
# brokers are LAN mqtt:// by design (#1). No TLS feature means no provider and
# no PQ question, because there is no TLS. If a TLS broker ever appears, the
# answer is aws-lc-rs and cmake in the tenant, per the post-quantum principle.
rumqttc = { version = "0.25", default-features = false }
tokio = { version = "1.36", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal"] }
